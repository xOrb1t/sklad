services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sklad
      POSTGRES_PASSWORD: sklad
      POSTGRES_DB: sklad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sklad"]
      interval: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      # bot applies migrations on start
      bot:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # Traefik: удалите ports и раскомментируйте
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.sklad.rule=Host(`sklad.example.com`)
    #   - traefik.http.routers.sklad.entrypoints=websecure
    #   - traefik.http.routers.sklad.tls.certresolver=le
    #   - traefik.http.services.sklad.loadbalancer.server.port=8080

volumes:
  postgres_data:
