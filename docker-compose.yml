services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sklad
      POSTGRES_PASSWORD: sklad
      POSTGRES_DB: sklad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sklad"]
      interval: 5s
      start_period: 10s
      retries: 5

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
